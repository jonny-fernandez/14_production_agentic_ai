name: Project 14 offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline-test dependencies
        run: python -m pip install -r requirements-cp2.txt
      - name: Validate tests, compiled LangGraph and synthetic evaluation
        run: python scripts/validate_cp4.py
      - name: Verify CP3 checkpoint adversarial probes (synthetic)
        env:
          PYTHONPATH: src
        run: python scripts/project14_cp3_adversarial_probe.py
